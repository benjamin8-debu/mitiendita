<!-- registrar.page.html · Formulario para registrar o editar -->
<ion-header>
  <ion-toolbar color="primary">
    @if (editando) { <ion-buttons slot="start"><ion-back-button defaultHref="/tabs/productos"></ion-back-button></ion-buttons> }
    <ion-title>{{ editando ? 'Editar producto' : 'Registrar producto' }}</ion-title>
  </ion-toolbar>
</ion-header>

<ion-content class="ion-padding">
  <!-- [(ngModel)]: lo que escribes se guarda en datos.nombre (y viceversa) -->
  <ion-input label="Nombre" labelPlacement="floating" fill="outline" [(ngModel)]="datos.nombre" placeholder="Ej.: Azúcar rubia 1 kg"></ion-input>

  <ion-select label="Categoría" labelPlacement="floating" fill="outline" [(ngModel)]="datos.categoria" class="ion-margin-top">
    @for (c of categorias; track c) { <ion-select-option [value]="c">{{ c }}</ion-select-option> }
  </ion-select>

  <!-- inputmode="decimal": en el celular abre el teclado numérico -->
  <ion-input label="Precio (S/)" labelPlacement="floating" fill="outline" type="number" inputmode="decimal" [(ngModel)]="datos.precio" class="ion-margin-top"></ion-input>
  <ion-input label="Stock (unidades)" labelPlacement="floating" fill="outline" type="number" inputmode="numeric" [(ngModel)]="datos.stock" class="ion-margin-top"></ion-input>

  <ion-button expand="block" class="ion-margin-top" (click)="guardar()">
    <ion-icon slot="start" name="save"></ion-icon> {{ editando ? 'Guardar cambios' : 'Registrar' }}
  </ion-button>
</ion-content>
